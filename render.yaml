# =============================================================================
# DESPLIEGUE EN RENDER  -  PARA EL 3ER PARCIAL (por ahora todo se corre en local)
#
# Para activarlo: descomentar TODO el bloque de abajo, subir a GitHub y en Render
# elegir "New > Blueprint" apuntando a este repositorio.
#
# Notas:
#  - Render ofrece PostgreSQL administrado (no MySQL), por eso el proyecto usa Postgres.
#  - Son DOS bases (seguridad y negocio). En el plan gratuito solo hay 1 base por
#    cuenta: o se paga la segunda, o se usa una sola instancia con las dos bases
#    creadas a mano (CREATE DATABASE) y se corre cada reset_*.sql con DBeaver/psql.
#  - Las fotos se guardan en disco. El disco del plan gratuito se borra en cada
#    despliegue: para produccion agregar un Disk (de pago) montado en /datos/evidencias
#    o pasar a almacenamiento tipo S3.
#  - SMTP: crear una cuenta (Brevo, Mailgun, Gmail con contrasena de aplicacion...)
#    y completar SMTP_* en el panel de Render. Con CORREO_HABILITADO=false el
#    administrador ve la clave temporal en pantalla.
