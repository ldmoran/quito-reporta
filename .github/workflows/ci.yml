name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servicio:
    name: Servicio (Spring Boot) - pruebas unitarias e integracion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alerta-quito-servicio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify = pruebas unitarias (surefire) + integracion con Testcontainers (failsafe).
      # El runner trae Docker, asi que levanta dos Postgres reales con los reset_*.sql.
      - name: Compilar y probar
        run: mvn -B verify
      - name: Subir reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-servicio
          path: |
            alerta-quito-servicio/target/surefire-reports
            alerta-quito-servicio/target/failsafe-reports

  interfaz:
    name: Interfaz (Angular) - pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alerta-quito-interfaz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alerta-quito-interfaz/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Pruebas (Chrome headless)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Build de produccion
        run: npx ng build --configuration production

  sistema:
    name: Sistema completo (docker compose + prueba de humo)
    runs-on: ubuntu-latest
    needs: [servicio, interfaz]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar bases, servicio, interfaz y Mailpit
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Prueba de humo de extremo a extremo
        run: python3 scripts/prueba_humo.py
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # DESPLIEGUE EN RENDER  (3er parcial - por ahora todo es local)
  # Para activarlo: descomentar este job, crear el servicio en Render con render.yaml
  # y guardar en GitHub (Settings > Secrets) la URL del Deploy Hook como RENDER_DEPLOY_HOOK_*.
